name: 🚀 Build & Deploy to Pipra Host

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Production Build and FTP Upload
    runs-on: ubuntu-latest

    steps:
      # ১. কোড নামানো
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # ২. Node.js সেটআপ
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ৩. .env ফাইল তৈরি
      - name: 🔑 Make CI .env file
        working-directory: ./osdel-project
        env:
          SECRET_ENV_DATA: ${{ secrets.ENV_FILE }}
        run: |
          echo "$SECRET_ENV_DATA" > .env

      # ৪. Install & Build
      - name: 🏗️ Install & Build
        working-directory: ./osdel-project
        run: |
          npm ci
          npm run build

      # ৫. FTP Upload — SamKirkland (সঠিক নাম)
      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./osdel-project/dist/
          server-dir: /public_html/
          dangerous-clean-slate: false