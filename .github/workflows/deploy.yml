name: 🚀 Build & Deploy to Pipra Host

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Production Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔑 Make CI .env file
        working-directory: ./osdel-project
        env:
          SECRET_ENV_DATA: ${{ secrets.ENV_FILE }}
        run: |
          echo "$SECRET_ENV_DATA" > .env

      - name: 🏗️ Install & Build
        working-directory: ./osdel-project
        run: |
          npm ci
          npm run build

      - name: 🔐 Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 22 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 🗑️ Clear old files on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} \
            "rm -f ~/public_html/index.html && rm -rf ~/public_html/assets && echo 'cleared'"

      - name: 📤 Upload index.html
        run: |
          scp -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ./osdel-project/dist/index.html \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/public_html/index.html

      - name: 📤 Upload assets folder
        run: |
          scp -r -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            ./osdel-project/dist/assets \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:~/public_html/