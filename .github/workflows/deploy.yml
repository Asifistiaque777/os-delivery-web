name: 🚀 Build & Deploy to Pipra Host

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Production Build and FTP Upload
    runs-on: ubuntu-latest

    steps:
      # ১. কোড নামানো হচ্ছে
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # ২. নোড সেটআপ
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ৩. osdel-project ফোল্ডারের ভেতর .env ফাইল তৈরি
      - name: 🔑 Make CI .env file
        working-directory: ./osdel-project
        env:
          SECRET_ENV_DATA: ${{ secrets.ENV_FILE }}
        run: |
          echo "$SECRET_ENV_DATA" > .env

      # ৪. প্রজেক্ট বিল্ড করা
      - name: 🏗️ Install & Build inside osdel-project
        working-directory: ./osdel-project
        run: |
          npm cache clean --force
          npm ci
          npm run build

      # ── 🚨 ৫. আলটিমেট ফিক্স: একদম ভিন্ন এবং সুপার-ফাস্ট FTP অ্যাকশন প্লাগইন ব্যবহার ──
      - name: 📂 Sync files via FTP (Timeout Proof)
        uses: AfonsoMatos/FTP-Deploy-Action@v1.2.0
        with:
          ftp-server: ${{ secrets.FTP_SERVER }}
          ftp-username: ${{ secrets.FTP_USERNAME }}
          ftp-password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./osdel-project/dist/
          server-dir: /