name: 🚀 Build & Deploy to Pipra Host

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔍 Debug project structure
        run: |
          pwd
          ls -R

      - name: 🔑 Create .env
        working-directory: ./osdel-project
        env:
          SECRET_ENV_DATA: ${{ secrets.ENV_FILE }}
        run: |
          echo "$SECRET_ENV_DATA" > .env

      - name: 🔍 Debug package.json
        working-directory: ./osdel-project
        run: |
          cat package.json
          npm run

      - name: 🏗️ Install dependencies
        working-directory: ./osdel-project
        run: npm ci

      - name: 🏗️ Build project
        working-directory: ./osdel-project
        run: npm run build

      - name: 📂 Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./osdel-project/dist/
          server-dir: /
          dangerous-clean-slate: false