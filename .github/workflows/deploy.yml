name: 🚀 Build & Deploy to Pipra Host

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Production Build and FTP Upload
    runs-on: ubuntu-latest

    steps:
      # ১. কোড নামানো হচ্ছে
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # ২. নোড সেটআপ
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── 🚨 ৩. ফিক্সড স্টেপ: osdel-project ফোল্ডারের ভেতর সেফলি ঢুকে .env ফাইল তৈরি ──
      - name: 🔑 Make CI .env file
        working-directory: ./osdel-project
        env:
          SECRET_ENV_DATA: ${{ secrets.ENV_FILE }}
        run: |
          echo "$SECRET_ENV_DATA" > .env

      # ৪. সাব-ফোল্ডারের ভেতরেই ফ্রেশ ডিপেন্ডেন্সি ইনস্টল ও বিল্ড তৈরি
      - name: 🏗️ Install & Build inside osdel-project
        working-directory: ./osdel-project
        run: |
          npm cache clean --force
          npm install
          npm run build

      # ৫. তৈরি হওয়া বিল্ড ফাইলগুলো FTP-তে পুশ করা
      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./osdel-project/dist/
          server-dir: /
          dangerous-clean-slate: false