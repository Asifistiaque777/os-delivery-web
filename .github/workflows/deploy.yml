name: 🚀 Build & Deploy to Pipra Host

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: 🎉 Production Build and FTP Upload
    runs-on: ubuntu-latest

    steps:
      # ১. কোড নামানো হচ্ছে
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # ২. নোড সেটআপ
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ৩. osdel-project ফোল্ডারের ভেতর .env ফাইল তৈরি
      - name: 🔑 Make CI .env file
        working-directory: ./osdel-project
        env:
          SECRET_ENV_DATA: ${{ secrets.ENV_FILE }}
        run: |
          echo "$SECRET_ENV_DATA" > .env

      # ৪. প্রজেক্ট বিল্ড করা
      - name: 🏗️ Install & Build inside osdel-project
        working-directory: ./osdel-project
        run: |
          npm ci
          npm run build

      # 📂 ৫. FTP দিয়ে সরাসরি public_html-এ বিল্ড ফাইল আপলোড
      - name: 📂 Sync files via FTP
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./osdel-project/dist/
          server-dir: ./